name: Deploy J.A.R.V.I.S. to GitHub Pages

on:
  push:
    branches:
      - claude/zealous-dirac-yjkOm
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (habilita automaticamente)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
